name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use a fake embedding model, so the heavy sentence-transformers/torch install is skipped here.
      - run: pip install "streamlit>=1.42" chromadb pypdf python-docx youtube-transcript-api requests numpy pytest reportlab
      - run: python -m pytest -q
